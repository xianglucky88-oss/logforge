source:
  path: /tmp/logforge/app.log
  poll_interval_ms: 200
  # 轮转后旧文件连续静默多少轮就封闭（句柄释放）
  rotate_drain_quiet_polls: 3
  # 旧文件最长 drain 时间，超时强制封闭
  rotate_drain_max_ms: 30000
  # 启动时找回"停机期间被轮转"文件的匹配模式，默认 path+"*"
  # backlog_glob: /tmp/logforge/app.log*

multiline:
  # 一条记录的起始行：带时间戳的堆栈头、JSON 行、logfmt 行
  start_pattern: '^(\d{4}-\d{2}-\d{2}T|\{|ts=)'
  max_lines: 200
  flush_after_ms: 2000

parsers:
  - name: json
  - name: logfmt

buffer:
  capacity: 1024
  policy: drop_oldest
  spill_dir: /tmp/logforge/spill

route:
  rules: []
  default: [all]

sinks:
  - name: all
    type: file
    config:
      path: /tmp/logforge/out/all.log

offset:
  path: /tmp/logforge/offset.json
  # 已确认位点的周期提交间隔；崩溃时的重放窗口由它界定
  commit_interval_ms: 1000
