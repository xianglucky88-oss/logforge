source:
  path: /tmp/logforge/app.log
  poll_interval_ms: 200

multiline:
  # 一条记录的起始行：带时间戳的堆栈头、JSON 行、logfmt 行
  start_pattern: '^(\d{4}-\d{2}-\d{2}T|\{|ts=)'
  max_lines: 200
  flush_after_ms: 2000

parsers:
  - name: json
  - name: logfmt

buffer:
  capacity: 1024
  policy: drop_oldest
  spill_dir: /tmp/logforge/spill

route:
  rules: []
  default: [all]

sinks:
  - name: all
    type: file
    config:
      path: /tmp/logforge/out/all.log

offset:
  path: /tmp/logforge/offset.json
